[NIST_AC-2_Account_Management]
check_type = file_permission
target_file = /etc/passwd
expected_permission = 644
remediation = "Restrict write access to root user only using 'chmod 644 /etc/passwd'."

[NIST_IA-5_Password_Policy]
check_type = configuration_value
target_file = security_policy.conf
parameter = min_password_length
expected_value = 14
remediation = "Update security_policy.conf to enforce a minimum password length of 14 characters."

[CIS_1.1_S3_Encryption]
check_type = environment_variable
variable_name = AWS_S3_ENCRYPTION
expected_value = TRUE
remediation = "Enable default AES-256 encryption on all active S3 buckets."